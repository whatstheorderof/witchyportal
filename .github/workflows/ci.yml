name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The build does not need a real database; pages read data at request time.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-secret-not-used-in-any-deployment-000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
